name: Validate and deploy BAND MCP

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated main branch to the approved production environment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: band-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Type-check, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Reject an unapproved deployment branch
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        shell: bash
        env:
          TARGET_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployment is only allowed from main."
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
      - name: Validate the Worker offline
        shell: bash
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          npm run check

  deploy:
    name: Deploy approved production Worker
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
      - name: Check deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure the production Cloudflare deployment secret and account variable."
            exit 1
          fi
      - name: Deploy the Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          npm run deploy
